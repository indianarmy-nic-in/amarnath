    <!-- App Navigation Script (URL Bar & Browser Open Hone Se Rokne Ke Liye) -->
    <script>
      (function() {
        // App me sabhi internal link clicks ko intercept karein
        document.addEventListener('click', function(e) {
          var target = e.target;
          while (target && target.tagName !== 'A') {
            target = target.parentNode;
          }
          
          if (target && target.tagName === 'A') {
            var href = target.getAttribute('href');
            
            // External links, hash links, ya javascript calls ko ignore karein
            if (!href || href.startsWith('#') || href.startsWith('javascript:') || target.getAttribute('target') === '_blank') {
              return;
            }

            var destUrl = new URL(target.href, window.location.href);
            
            // Agar same domain ka link hai to browser window ke bajaye app ke andar hi navigate karein
            if (destUrl.origin === window.location.origin) {
              e.preventDefault();
              window.location.href = target.href;
            }
          }
        }, false);

        // Basic Service Worker Registration for PWA Compliance
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            var swCode = "self.addEventListener('fetch', function(e) { e.respondWith(fetch(e.request)); });";
            var blob = new Blob([swCode], { type: 'text/javascript' });
            var swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).catch(function(){});
          });
        }
      })();
    </script>
