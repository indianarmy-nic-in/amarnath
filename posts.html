<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Posts Preview</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding-bottom: 50px;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #ffffff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-img {
            width: 85px;
            height: 42px;
            object-fit: cover;
            border-radius: 4px;
        }

        .back-btn {
            background: #34495e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        /* Banner Section */
        .banner-container {
            width: 100%;
            height: 150px;
            background: #ddd;
            overflow: hidden;
        }

        .banner-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Section Title */
        .section-title {
            padding: 20px 16px 10px 16px;
            font-size: 20px;
            color: #2c3e50;
        }

        /* Post Grid Container (2 items per line on mobile) */
        .posts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding: 0 16px;
        }

        .post-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        .post-card img {
            width: 100%;
            height: 130px;
            object-fit: cover;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .post-card img:hover {
            opacity: 0.9;
        }

        .post-content {
            padding: 10px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .post-content h5 {
            font-size: 14px;
            margin-bottom: 4px;
            color: #2c3e50;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .post-content p {
            font-size: 12px;
            color: #666;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Fullscreen Popup Modal */
        #imageModal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #modalImg {
            max-width: 100%;
            max-height: 80vh;
            border-radius: 8px;
            object-fit: contain;
        }

        /* No posts placeholder */
        .no-posts {
            grid-column: span 2;
            text-align: center;
            padding: 40px;
            color: #777;
            font-size: 15px;
        }

        /* Footer */
        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Flag_of_Indian_Army.svg/3840px-Flag_of_Indian_Army.svg.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=thumbnail" alt="Logo" class="header-img">
        <img src="https://upload.wikimedia.org/wikipedia/commons/b/b8/Ministry_of_Defence_India.svg?utm_source=en.wikipedia.org&utm_campaign=index&utm_content=original" alt="Logo" class="header-img">
    </header>

    <div class="banner-container">
        <img src="https://picsum.photos/800/400?blur=1" alt="Preview Banner">
    </div>

    <h2 class="section-title">Maj Manish Chaudhary</h2>

    <div class="posts-grid" id="postsGridContainer">
        </div>

    <div id="imageModal" onclick="closeModal()">
        <img id="modalImg" src="" alt="Popup View">
    </div>

    <footer>
        <p>&copy; 2026 Integrated Headquarters of the Ministry of Defence (Army)</p>
    </footer>

    <script>
        // Load Posts from LocalStorage on page load
        window.onload = function() {
            loadPosts();
        };

        function loadPosts() {
            const gridContainer = document.getElementById('postsGridContainer');
            const posts = JSON.parse(localStorage.getItem('all_global_posts')) || [];

            if (posts.length === 0) {
                gridContainer.innerHTML = `<div class="no-posts">No posts uploaded yet. </div>`;
                return;
            }

            let htmlContent = '';
            posts.forEach(post => {
                htmlContent += `
                    <div class="post-card">
                        <img src="${post.image}" alt="Post Image" onclick="openModal('${post.image}')">
                        <div class="post-content">
                            <h5>${escapeHtml(post.title)}</h5>
                            <p>${escapeHtml(post.description)}</p>
                        </div>
                    </div>
                `;
            });

            gridContainer.innerHTML = htmlContent;
        }

        function openModal(imageSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = imageSrc;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // Helper to prevent HTML injection errors from user text inputs
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
